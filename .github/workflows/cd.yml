name: CD

# Continuous Deployment — SCAFFOLD (disabled until a deploy target is chosen).
#
# The project is in the CI-only phase: no hosting/infra yet. These jobs are
# disabled via the `DEPLOY_ENABLED` repository variable and carry the intended
# zero-downtime step sequence so that wiring up a real target (Laravel Forge/Ploi,
# GHCR image + orchestrator, or a PaaS) is a fill-in-the-blanks, not a rebuild.
#
# To activate: set repo variable DEPLOY_ENABLED=true, create the `staging` and
# `production` GitHub Environments (add required reviewers + a wait timer to
# production), and replace the TODO steps with the real deploy for your target.

on:
  push:
    branches: [develop] # -> staging
    tags: ["v*"] # -> production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build & Push Image (stub)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: docker/build-push-action -> GHCR, multi-stage production Dockerfile,
      # tagged with the commit SHA + SemVer, with SBOM + provenance attestations.
      - run: |
          echo "TODO: build and push the production image"

  deploy-staging:
    name: Deploy to Staging (stub)
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop' }}
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: |
          echo "TODO: deploy to staging, then run the zero-downtime sequence:"
          echo "  php artisan migrate --force"
          echo "  php artisan config:cache route:cache view:cache event:cache"
          echo "  php artisan queue:restart && php artisan horizon:terminate"
          echo "  health check: curl -f https://staging.example.com/up"

  deploy-production:
    name: Deploy to Production (stub)
    if: ${{ vars.DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-image
    runs-on: ubuntu-latest
    environment: production # add required reviewers + wait timer in repo settings
    steps:
      - run: |
          echo "TODO: deploy to production (same zero-downtime sequence as staging)"
          echo "  + smoke test + auto-rollback on failed /up health check"
