name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-style:
    name: Code Style (Pint / PER-CS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis (Larastan, level max)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests (Pest + architecture)
        run: vendor/bin/pest --ci
      - name: Type coverage (blocking, 100%)
        if: matrix.php == '8.5'
        run: vendor/bin/pest --type-coverage --min=100
      - name: Code coverage (advisory — raise & make blocking as the suite grows)
        if: matrix.php == '8.5'
        continue-on-error: true
        run: vendor/bin/pest --coverage --min=30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: composer audit --no-interaction

  rector:
    name: Rector (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      # Advisory only — surface refactor suggestions in the log without failing the check.
      - run: vendor/bin/rector process --dry-run || true

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [code-style, static-analysis, tests, security]
    steps:
      - name: Verify required gates
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Gate results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required gates failed."
            exit 1
          fi
          echo "All required gates passed."
