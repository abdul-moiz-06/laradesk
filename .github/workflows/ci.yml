name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-style:
    name: Code Style (Pint / PER-CS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis (Larastan, level max)
    runs-on: ubuntu-latest
    # Larastan boots the application to analyse it; with encrypted sessions the
    # boot needs an app key. This is a throwaway key for analysis only.
    env:
      APP_KEY: base64:Oaz8VEx1hsKLg1kDMtEvrgEx578OxsOJwqgqR+1wl+o=
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: laradesk
      DB_PASSWORD: password
      DB_ADMIN_USERNAME: postgres
      DB_ADMIN_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - name: Prepare database (non-superuser app role for RLS)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE laradesk WITH LOGIN PASSWORD 'password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            ALTER DATABASE testing OWNER TO laradesk;
          SQL
          psql -h 127.0.0.1 -U postgres -d testing -v ON_ERROR_STOP=1 <<'SQL'
            ALTER SCHEMA public OWNER TO laradesk;
            GRANT ALL ON SCHEMA public TO laradesk;
          SQL
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests (Pest + architecture)
        run: vendor/bin/pest --ci
      - name: Type coverage (blocking, 100%)
        if: matrix.php == '8.5'
        run: vendor/bin/pest --type-coverage --min=100
      - name: Code coverage (advisory — raise & make blocking as the suite grows)
        if: matrix.php == '8.5'
        continue-on-error: true
        run: vendor/bin/pest --coverage --min=30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - run: composer audit --no-interaction

  rector:
    name: Rector (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      # Advisory only — surface refactor suggestions in the log without failing the check.
      - run: vendor/bin/rector process --dry-run || true

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [code-style, static-analysis, tests, security]
    steps:
      - name: Verify required gates
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Gate results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required gates failed."
            exit 1
          fi
          echo "All required gates passed."
