name: Setup PHP and Composer
description: Install PHP with required extensions and Composer dependencies (cached)

inputs:
  php-version:
    description: PHP version to set up
    required: false
    default: "8.4"

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, pdo, pgsql, pdo_pgsql, redis, bcmath, intl, zip, gd
        coverage: xdebug
        tools: composer:v2

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ inputs.php-version }}-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist
